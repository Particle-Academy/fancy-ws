name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Release gate: a tag with no CHANGELOG entry fails HERE, before the
      # package reaches the registry. A published version whose changes are
      # undocumented cannot be repaired later -- the tarball is already out,
      # and whoever upgraded into it has no way to learn what changed.
      - name: Changelog entry for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::No CHANGELOG.md. Every package keeps one."
            exit 1
          fi
          if ! grep -qE "^## +\[?v?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION}. Add one — say what a consumer must DO — then re-tag."
            exit 1
          fi
          # ORDER, not just presence. A consumer deciding whether to upgrade
          # reads top-down, so complete-but-mis-ordered is a truthful-looking
          # lie -- and it is invisible to whoever wrote it, because they are
          # looking at their own entry rather than at the file.
          FIRST=$(grep -E '^## ' CHANGELOG.md | grep -viE '^## +\[?unreleased\]?' | head -1)
          if ! printf '%s' "$FIRST" | grep -qE "^## +\[?v?${VERSION}\]?"; then
            echo "::error::CHANGELOG.md has an entry for ${VERSION}, but it is NOT the first version heading."
            echo "::error::Top of file is: ${FIRST}"
            exit 1
          fi
          echo "Found changelog entry for ${VERSION}, and it is the newest."

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npx tsup

      # Gates the TARBALL, not the source. Both entry points are imported and a
      # real connection is opened through each, and the zero-dependency claim
      # is checked against the bundle's own text rather than against the
      # manifest alone.
      - name: Smoke-test the built artifact
        run: node scripts/smoke.mjs

      # Trusted Publishing (OIDC) -- no tokens. Needs npm 11.5.1+ (the runner
      # ships npm 10.x), hence the pinned npx. 11.18.0 specifically: 12.0.0
      # broke provenance in this estate.
      - name: Publish
        run: npx -y npm@11.18.0 publish --provenance --access public

      # A package can be fully published and completely invisible on GitHub --
      # measured across this estate, every TypeScript repo publishing to npm
      # had zero GitHub releases. Automated rather than left to a checklist,
      # because a manual step is what produced that gap. It runs AFTER the npm
      # publish deliberately: the tarball is immutable, so a release announcing
      # a version that failed to publish could not be walked back.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1 }; next }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          echo "Published release $GITHUB_REF_NAME."
